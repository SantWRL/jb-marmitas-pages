<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JB Marmitas - Cardápio</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="header-banner">
    <div class="header-overlay">
      <span>COMIDA DE VERDADE, FEITA COM CARINHO</span>
    </div>
  </header>
  
  <section class="company-info">
    <img class="company-logo" src="assets/img/logo.svg" alt="Logo JB Marmitas" />
    <p class="store-kicker">MARMITARIA CASEIRA EM PICOS</p>
    <h1>JB Marmitas</h1>
    <p>Marmitas caseiras feitas no dia. Segunda a sábado, das 11h às 14h30.</p>
    <div class="top-actions">
      <span class="status-badge"><span class="status-dot"></span> Aberto para pedidos</span>
      <a href="adm.html" class="nav-link-btn">Área administrativa</a>
    </div>
    <div class="contact-actions">
      <a class="contact-link whatsapp-link" href="https://wa.me/558999195466" target="_blank" rel="noopener noreferrer">Pedir pelo WhatsApp</a>
      <a class="contact-link portfolio-link" href="https://santwrl.github.io/SantWRL/" target="_blank" rel="noopener noreferrer">Conheça meu portfólio</a>
    </div>
  </section>

  <nav class="categories-bar">
    <button class="category-btn active" data-category="pratos">Pratos do Dia</button>
    <button class="category-btn" data-category="bebidas">Bebidas</button>
  </nav>

  <main class="container">
    <div class="menu-heading">
      <span>ESCOLHA SEU FAVORITO</span>
      <h2>Nosso cardápio</h2>
    </div>
    <div id="menu-container"></div>
  </main>

  <div class="cart-bar">
    <button class="cart-button" id="cart-btn">
      <span class="cart-count" id="cart-count">0 itens</span>
      <span>Enviar Pedido WhatsApp</span>
      <span id="cart-total">R$ 0,00</span>
    </button>
  </div>

  <script type="module" src="assets/js/client.js"></script>
</body>
</html>
