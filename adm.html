<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Administrador - JB Marmitas</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="header-banner"></header>
  
  <section class="company-info">
    <img class="company-logo" src="assets/img/logo.svg" alt="Logo JB Marmitas" />
    <h1>Painel do Administrador</h1>
    <div class="top-actions">
      <a href="index.html" class="nav-link-btn">⬅ VOLTAR AO CARDÁPIO</a>
    </div>
  </section>

  <main class="container">
    <section id="admin-login" class="admin-login-card">
      <h2>Acesso restrito</h2>
      <p>Entre com a senha para gerenciar o cardápio e os pedidos.</p>
      <form id="admin-login-form">
        <label class="form-group">
          <span>Senha do administrador</span>
          <input type="password" id="admin-password" autocomplete="current-password" required />
        </label>
        <p id="admin-login-error" class="form-error" role="alert"></p>
        <button type="submit" class="btn-submit">Entrar no painel</button>
      </form>
    </section>

    <div id="admin-content" hidden>
      <div class="admin-toolbar">
        <p>Gerencie suas marmitas, bebidas, promoções e disponibilidade.</p>
        <button type="button" id="admin-logout" class="btn-logout">Sair</button>
      </div>

      <section class="admin-form-card">
      <h3>➕ Cadastrar Novo Item no Cardápio</h3>
      <form id="add-product-form">
        <div class="form-group">
          <label>Nome do Item:</label>
          <input type="text" id="new-name" placeholder="Ex: Marmita de Carne Assada" required />
        </div>
        <div class="form-group">
          <label>Categoria:</label>
          <select id="new-category">
            <option value="pratos">Pratos do Dia</option>
            <option value="bebidas">Bebidas</option>
          </select>
        </div>
        <div class="form-group">
          <label>Descrição:</label>
          <textarea id="new-desc" rows="2" placeholder="Ex: Arroz, feijão, purê e salada..." required></textarea>
        </div>
        <div class="form-group">
          <label>Preço (R$):</label>
          <input type="number" id="new-price" min="0.01" step="0.01" placeholder="20.00" required />
        </div>
        <div class="form-group">
          <label>Foto do Computador/Celular:</label>
          <input type="file" id="new-file" accept="image/*" />
        </div>
        <div class="form-group">
          <label>Ou Link de Imagem Web:</label>
          <input type="url" id="new-image-url" placeholder="https://exemplo.com/foto.jpg" />
        </div>
        <button type="submit" class="btn-submit">Cadastrar Item</button>
      </form>
      </section>

    <nav class="categories-bar">
      <button class="category-btn active" data-category="pratos">Gerenciar Pratos</button>
      <button class="category-btn" data-category="bebidas">Gerenciar Bebidas</button>
    </nav>

      <div id="admin-menu-container"></div>
    </div>
  </main>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
